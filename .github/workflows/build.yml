name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Ruffle (self-hosted web build)
        run: |
          DEST="$GITHUB_WORKSPACE/app/src/main/assets/ruffle"
          mkdir -p "$DEST"
          cd "$(mktemp -d)"
          npm pack @ruffle-rs/ruffle
          tar -xzf ./*.tgz
          RJS="$(find package -name ruffle.js | head -1)"
          test -n "$RJS" || { echo "ruffle.js not found in package"; exit 1; }
          cp -r "$(dirname "$RJS")"/. "$DEST"/
          ls -la "$DEST"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: raze-apk
          path: app/build/outputs/apk/debug/app-debug.apk
