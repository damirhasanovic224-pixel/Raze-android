plugins {
    id 'com.android.application'
}

android {
    namespace 'com.razemobile'
    compileSdk 34

    defaultConfig {
        applicationId 'com.razemobile.raze'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'wasm'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
