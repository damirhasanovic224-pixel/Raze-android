<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Raze</title>
<style>
  :root {
    --stick: min(34vh, 170px);
    --btn: min(15vh, 64px);
    --edge: 4vw;
    --line: rgba(255,255,255,.30);
    --fill: rgba(255,255,255,.10);
    --hot: rgba(255,255,255,.38);
  }
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; }
  #stage ruffle-player { width: 100%; height: 100%; display: block; }

  #ui { position: fixed; inset: 0; pointer-events: none; }

  .stick {
    position: absolute; bottom: 5vh;
    width: var(--stick); height: var(--stick); border-radius: 50%;
    background: var(--fill); border: 2px solid var(--line);
    pointer-events: auto; touch-action: none;
  }
  .stick .knob {
    position: absolute; left: 50%; top: 50%;
    width: 42%; height: 42%; margin: -21% 0 0 -21%;
    border-radius: 50%; background: var(--hot);
  }
  #moveStick { left: var(--edge); }
  #aimStick  { right: var(--edge); }

  #btns {
    position: absolute; right: var(--edge);
    bottom: calc(5vh + var(--stick) + 14px);
    display: flex; gap: 12px; pointer-events: none;
  }
  .btn {
    pointer-events: auto; touch-action: none;
    width: var(--btn); height: var(--btn); border-radius: 50%;
    background: var(--fill); border: 2px solid var(--line); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font: 600 12px/1.15 system-ui, sans-serif; text-align: center;
  }
  .btn.on { background: var(--hot); }
  .btn b { font-size: 18px; font-weight: 700; }

  #log {
    position: fixed; left: 6px; top: 6px; right: 45%; z-index: 5; pointer-events: none;
    color: #8f8; font: 10px/1.3 monospace; white-space: pre-wrap; text-shadow: 0 0 2px #000;
  }
  #msg {
    position: fixed; left: 8vw; right: 8vw; top: 10vh; display: none;
    color: #fff; background: rgba(160,30,30,.9); padding: 12px 16px;
    border-radius: 8px; font: 14px/1.4 system-ui, sans-serif; pointer-events: none;
  }
</style>
<script>
  const QS = new URLSearchParams(location.search);
  const RENDERER = QS.get('renderer') || 'auto';
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = Object.assign({
    autoplay: "on",
    splashScreen: false,
    letterbox: "on",
    backgroundColor: "#000000"
  }, RENDERER !== 'auto' ? { preferredRenderer: RENDERER } : {});

  /* on-screen debug log (set to false to hide) */
  const DEBUG = true;
  const LOG = [];
  function logLine(t) {
    LOG.push(String(t).slice(0, 120));
    while (LOG.length > 8) LOG.shift();
    const el = document.getElementById('log');
    if (el) el.textContent = LOG.join('\n');
  }
  if (DEBUG) {
    ['log', 'info', 'warn', 'error'].forEach(k => {
      const orig = console[k].bind(console);
      console[k] = (...a) => { orig(...a); logLine(k + ': ' + a.map(x => (x && x.message) || x).join(' ')); };
    });
    window.addEventListener('error', e => logLine('ERR: ' + e.message));
    window.addEventListener('unhandledrejection', e => logLine('REJ: ' + (e.reason && e.reason.message || e.reason)));
  }
</script>
<script src="ruffle/ruffle.js"></script>
</head>
<body>
<div id="stage"></div>

<div id="ui">
  <div id="btns">
    <div class="btn" id="btnSwap">Swap<b id="wnum">1</b></div>
    <div class="btn" id="btnReload"><b>R</b>Reload</div>
    <div class="btn" id="btnAbility">Ability</div>
  </div>
  <div class="stick" id="moveStick"><div class="knob"></div></div>
  <div class="stick" id="aimStick"><div class="knob"></div></div>
</div>
<div id="log"></div>
<div id="msg"></div>

<script>
/* ================= CONFIG: edit these lines ================= */
const CONFIG = {
  keys: { up: 'w', left: 'a', down: 's', right: 'd', reload: 'r', ability: 'e' }, // ability 'e' is a placeholder
  swapKeys: ['1','2','3','4','5','6','7','8','9'], // each tap sends the next one. Use ['q'] for the Q key instead.
  swapStartsOn: 1,        // weapon assumed equipped at launch (first tap sends the next number)
  moveDeadzone: 0.35,     // how far the left stick must move before a key is held
  aim: {
    radius: 0.42,         // cursor distance from the character, as a fraction of the screen's short side
    centerX: 0.5,         // where the character sits on screen (0 = left edge, 1 = right edge)
    centerY: 0.5,         // 0 = top, 1 = bottom
    deadzone: 0.15,       // below this the stick is treated as centered
    fireAt: 0.6           // push the aim stick past this to hold fire
  },
  mouseEvents: 'pointer'  // 'pointer', 'mouse' or 'both' (try 'both' if aiming doesn't register)
};
/* ============================================================ */

let player = null;
const stage = document.getElementById('stage');
document.addEventListener('contextmenu', e => e.preventDefault());

function target() {
  return (player && player.shadowRoot && player.shadowRoot.querySelector('canvas')) || player || document.body;
}

function keyInfo(n) {
  n = String(n).toLowerCase();
  if (/^[a-z]$/.test(n)) { const u = n.toUpperCase(); return { key: n, code: 'Key' + u, kc: u.charCodeAt(0) }; }
  if (/^[0-9]$/.test(n)) return { key: n, code: 'Digit' + n, kc: 48 + Number(n) };
  if (n === 'space') return { key: ' ', code: 'Space', kc: 32 };
  if (n === 'shift') return { key: 'Shift', code: 'ShiftLeft', kc: 16 };
  throw new Error('Unknown key: ' + n);
}

function sendKey(name, down) {
  const k = keyInfo(name);
  target().dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', {
    key: k.key, code: k.code, keyCode: k.kc, which: k.kc,
    bubbles: true, cancelable: true, composed: true
  }));
}

function tap(name) {
  sendKey(name, true);
  setTimeout(() => sendKey(name, false), 70);
}

function sendMouse(kind, x, y, buttons) {
  const t = target();
  const base = { clientX: x, clientY: y, screenX: x, screenY: y, buttons, bubbles: true, cancelable: true, composed: true };
  const p = { move: 'pointermove', down: 'pointerdown', up: 'pointerup' }[kind];
  const m = { move: 'mousemove', down: 'mousedown', up: 'mouseup' }[kind];
  const button = kind === 'move' ? -1 : 0;
  if (CONFIG.mouseEvents !== 'mouse')
    t.dispatchEvent(new PointerEvent(p, { ...base, button, pointerId: 1, pointerType: 'mouse', isPrimary: true }));
  if (CONFIG.mouseEvents !== 'pointer')
    t.dispatchEvent(new MouseEvent(m, { ...base, button: Math.max(button, 0) }));
}

/* ---- movement: left stick -> WASD ---- */
const held = {};
function setKey(name, down) {
  if (!!held[name] === down) return;
  held[name] = down;
  sendKey(name, down);
}
function onMove(dx, dy) {
  const t = CONFIG.moveDeadzone, k = CONFIG.keys;
  setKey(k.left,  dx < -t);
  setKey(k.right, dx >  t);
  setKey(k.up,    dy < -t);
  setKey(k.down,  dy >  t);
}

/* ---- aim: right stick -> virtual mouse, auto-fire when pushed far ---- */
let firing = false, lastX = 0, lastY = 0;
function onAim(dx, dy) {
  const A = CONFIG.aim, mag = Math.hypot(dx, dy);
  if (mag < A.deadzone) {
    if (firing) { firing = false; sendMouse('up', lastX, lastY, 0); }
    return;
  }
  const r = (player || stage).getBoundingClientRect();
  const dist = Math.min(r.width, r.height) * A.radius;
  const x = r.left + r.width  * A.centerX + (dx / mag) * dist;
  const y = r.top  + r.height * A.centerY + (dy / mag) * dist;
  lastX = x; lastY = y;
  sendMouse('move', x, y, firing ? 1 : 0);
  if (!firing && mag >= A.fireAt) {
    firing = true; sendMouse('down', x, y, 1);
  } else if (firing && mag < A.fireAt - 0.1) {
    firing = false; sendMouse('up', x, y, 0);
  }
}

/* ---- joystick widget ---- */
function makeStick(el, cb) {
  const knob = el.querySelector('.knob');
  let id = null, cx = 0, cy = 0, R = 1;
  function update(e) {
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const d = Math.hypot(dx, dy);
    if (d > R) { dx *= R / d; dy *= R / d; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    cb(dx / R, dy / R);
  }
  el.addEventListener('pointerdown', e => {
    if (id !== null) return;
    id = e.pointerId;
    el.setPointerCapture(id);
    const r = el.getBoundingClientRect();
    cx = r.left + r.width / 2; cy = r.top + r.height / 2; R = r.width * 0.32;
    e.preventDefault();
    update(e);
  });
  el.addEventListener('pointermove', e => { if (e.pointerId === id) update(e); });
  const end = e => {
    if (e.pointerId !== id) return;
    id = null; knob.style.transform = ''; cb(0, 0);
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

/* ---- buttons ---- */
function makeButton(el, action) {
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.classList.add('on'); action(); });
  const off = () => el.classList.remove('on');
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
}

let swapIdx = CONFIG.swapKeys.indexOf(String(CONFIG.swapStartsOn));
const wnum = document.getElementById('wnum');
function showWeapon() { wnum.textContent = swapIdx >= 0 ? CONFIG.swapKeys[swapIdx].toUpperCase() : '-'; }
showWeapon();

makeStick(document.getElementById('moveStick'), onMove);
makeStick(document.getElementById('aimStick'), onAim);
makeButton(document.getElementById('btnReload'), () => tap(CONFIG.keys.reload));
makeButton(document.getElementById('btnAbility'), () => tap(CONFIG.keys.ability));
makeButton(document.getElementById('btnSwap'), () => {
  swapIdx = (swapIdx + 1) % CONFIG.swapKeys.length;
  tap(CONFIG.swapKeys[swapIdx]);
  showWeapon();
});

/* ---- start Ruffle ---- */
function showMsg(t) { const m = document.getElementById('msg'); m.textContent = t; m.style.display = 'block'; }

window.addEventListener('load', async () => {
  logLine('renderer setting: ' + RENDERER);
  const swf = new URLSearchParams(location.search).get('swf');
  try {
    if (!swf) throw new Error('No SWF selected.');
    if (!window.RufflePlayer || !window.RufflePlayer.newest) throw new Error('Ruffle did not load. Check the build log step "Fetch Ruffle".');
    player = window.RufflePlayer.newest().createPlayer();
    stage.appendChild(player);
    await player.load(swf);
    player.focus({ preventScroll: true });
  } catch (e) {
    showMsg('Could not start the game: ' + (e && e.message ? e.message : e));
  }
});
</script>
</body>
</html>
